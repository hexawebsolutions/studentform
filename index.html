<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-800">Join Our Course</h2>
            <p class="text-sm text-gray-500 mt-2">Apni details fill karein aur direct WhatsApp par rabta karein</p>
        </div>
        
        <form id="whatsappForm" class="space-y-4">
            <!-- Full Name -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" required placeholder="Apna pura naam likhein" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition">
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required placeholder="example@email.com" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition">
            </div>

            <!-- WhatsApp No -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">WhatsApp No</label>
                <input type="tel" id="whatsappNo" required placeholder="03XXXXXXXXX" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition">
            </div>

            <!-- Education -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Education</label>
                <input type="text" id="education" required placeholder="Misal ke taur par: Matric, Intermediate, Graduation" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition">
            </div>

            <!-- City -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">City</label>
                <input type="text" id="city" required placeholder="Apne shehar ka naam" class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-green-600/30 transition duration-200 mt-2">
                Send to WhatsApp
            </button>
        </form>
    </div>

    <script>
        document.getElementById('whatsappForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Admin WhatsApp number (Pakistan code 92 ke sath, baghair + sign ke)
            const adminPhone = "923403535397"; 

            // Form values get karna
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const whatsappNo = document.getElementById('whatsappNo').value;
            const education = document.getElementById('education').value;
            const city = document.getElementById('city').value;

            // Required Message format
            let text = `I required to Join Course%0A%0A`;
            text += `*Full Name:* ${fullName}%0A`;
            text += `*Email:* ${email}%0A`;
            text += `*WhatsApp No:* ${whatsappNo}%0A`;
            text += `*Education:* ${education}%0A`;
            text += `*City:* ${city}`;
            
            // WhatsApp URL generate karna
            const whatsappUrl = `https://wa.me/${adminPhone}?text=${text}`;

            // WhatsApp par redirect karna
            window.open(whatsappUrl, '_blank');
        });
    </script>

</body>
</html>
