<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Join Our Course - Premium Registration</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Optimized Animated Gradient Background */
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientAnimation 15s ease infinite;
        }

        /* Stable Glowing Border Animation */
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(35, 213, 171, 0.4), inset 0 0 10px rgba(35, 166, 213, 0.2); }
            50% { box-shadow: 0 0 30px rgba(231, 60, 126, 0.7), inset 0 0 15px rgba(238, 119, 82, 0.4); }
        }
        .glow-card {
            animation: glowPulse 5s infinite alternate;
        }

        /* Input Field Styling */
        .input-dark {
            background-color: #1f2937;
            border-color: #374151;
            color: #f3f4f6;
            -webkit-appearance: none;
        }
        .input-dark:focus {
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
            border-color: #22c55e;
            outline: none;
        }
        .input-dark::placeholder { color: #6b7280; }

        /* Smooth Transition Classes */
        .form-step {
            transition: all 0.4s ease-in-out;
        }
    </style>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center p-4">

    <!-- Dark Glassmorphism Card -->
    <div class="bg-gray-900/90 backdrop-blur-md p-6 sm:p-8 md:p-10 rounded-3xl glow-card w-full max-w-lg border border-gray-700/50 my-auto overflow-hidden relative">
        
        <!-- Header Section -->
        <div class="text-center mb-6">
            <span class="inline-block bg-gradient-to-r from-green-500 to-emerald-600 text-white text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-2 shadow-md">
                Premium Enrollment 2026
            </span>
            <h2 class="text-2xl sm:text-3xl md:text-4xl font-black text-gray-50 tracking-tight">Join Our Course</h2>
            <p id="subTitle" class="text-xs sm:text-sm text-gray-400 mt-1.5">Step 1: Enter your personal details</p>
        </div>
        
        <!-- Main Form Container -->
        <form id="whatsappForm">
            
            <!-- STEP 1: Personal Details -->
            <div id="step1" class="space-y-4 form-step">
                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-300 mb-1">Full Name</label>
                    <input type="text" id="fullName" required placeholder="e.g. John Doe" 
                        class="input-dark w-full px-4 py-3 rounded-xl font-medium text-sm sm:text-base border transition duration-200">
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-300 mb-1">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com" 
                        class="input-dark w-full px-4 py-3 rounded-xl font-medium text-sm sm:text-base border transition duration-200">
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-300 mb-1">WhatsApp Number</label>
                    <input type="tel" id="whatsappNo" required placeholder="03XXXXXXXXX" 
                        class="input-dark w-full px-4 py-3 rounded-xl font-medium text-sm sm:text-base border transition duration-200">
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-300 mb-1">Education</label>
                    <input type="text" id="education" required placeholder="e.g. Intermediate, BSCS, Matric" 
                        class="input-dark w-full px-4 py-3 rounded-xl font-medium text-sm sm:text-base border transition duration-200">
                </div>

                <div>
                    <label class="block text-xs sm:text-sm font-bold text-gray-300 mb-1">City</label>
                    <input type="text" id="city" required placeholder="e.g. Karachi, Lahore" 
                        class="input-dark w-full px-4 py-3 rounded-xl font-medium text-sm sm:text-base border transition duration-200">
                </div>

                <!-- Next Button -->
                <button type="button" id="nextBtn" 
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 sm:py-4 rounded-xl shadow-lg shadow-blue-900/40 active:scale-[0.99] transition-all duration-200 flex items-center justify-center space-x-2 text-base sm:text-lg border border-blue-400/30 mt-4">
                    <span>Next: Select Course</span>
                    <svg class="w-5 h-5 ml-2 fill-current" viewBox="0 0 24 24"><path d="M5 13h11.586l-5.293 5.293 1.414 1.414L21.414 12l-7.707-7.707-1.414 1.414L16.586 11H5z"/></svg>
                </button>
            </div>

            <!-- STEP 2: Course Selection (Initially Hidden) -->
            <div id="step2" class="space-y-6 form-step hidden opacity-0 translate-x-10">
                <div class="py-4">
                    <label class="block text-sm sm:text-base font-bold text-gray-200 mb-2">Select Your Desired Course</label>
                    <select id="courseSelect" required 
                        class="input-dark w-full px-4 py-4 rounded-xl font-medium text-sm sm:text-base border transition duration-200 cursor-pointer">
                        <option value="" disabled selected>-- Choose a Course --</option>
                        <option value="Basic AI">1. Basic AI</option>
                        <option value="Adsterra with Blog">2. Adsterra with Blog</option>
                        <option value="Adsterra">3. Adsterra</option>
                        <option value="YouTube Automation">4. YouTube Automation</option>
                        <option value="Tiktok Monetization">5. Tiktok Monetization</option>
                        <option value="Web Development & Laravel">6. Web Development & Laravel</option>
                        <option value="Graphic Designing">7. Graphic Designing</option>
                        <option value="Freelancing Mastery">8. Freelancing Mastery</option>
                        <option value="Video Editing">9. Video Editing</option>
                        <option value="Digital Marketing">10. Digital Marketing</option>
                    </select>
                </div>

                <div class="flex space-x-3 pt-2">
                    <!-- Back Button -->
                    <button type="button" id="backBtn" 
                        class="w-1/3 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-3.5 sm:py-4 rounded-xl border border-gray-700 transition duration-200">
                        Back
                    </button>
                    <!-- Submit to WhatsApp Button -->
                    <button type="submit" 
                        class="w-2/3 bg-gradient-to-r from-green-600 to-emerald-700 hover:from-green-500 hover:to-emerald-600 text-white font-bold py-3.5 sm:py-4 rounded-xl shadow-lg shadow-green-900/40 active:scale-[0.99] transition-all duration-200 flex items-center justify-center space-x-2 text-base sm:text-lg border border-green-500/30">
                        <span>Send to WhatsApp</span>
                        <svg class="w-5 h-5 ml-2 fill-current" viewBox="0 0 24 24">
                            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01C17.18 3.03 14.69 2 12.04 2zM12.04 20.1c-1.46 0-2.89-.39-4.13-1.13l-.3-.18-3.12.82.83-3.04-.2-.31c-.82-1.31-1.25-2.83-1.25-4.38 0-4.54 3.7-8.24 8.24-8.24 2.2 0 4.27.86 5.82 2.41 1.55 1.55 2.41 3.62 2.41 5.82 0 4.54-3.7 8.24-8.24 8.24zm4.52-6.16c-.25-.13-1.47-.72-1.7-.8-.23-.08-.4-.13-.57.13-.17.25-.66.8-1.1 1.01-.14.12-.29.14-.54.02-.25-.13-1.05-.39-2-1.23-.74-.66-1.24-1.48-1.38-1.73-.14-.25-.02-.38.11-.51.11-.11.25-.29.38-.43.13-.14.17-.25.25-.42.08-.17.04-.32-.02-.45-.06-.13-.57-1.38-.78-1.89-.2-.49-.4-.42-.57-.43l-.49-.01c-.17 0-.45.06-.68.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.02 2.61.12.17 1.77 2.7 4.29 3.78.6.26 1.07.42 1.44.54.61.19 1.16.16 1.6-.03.49-.22 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.3z"/>
                        </svg>
                    </button>
                </div>
            </div>

        </form>
    </div>

    <script>
        const nextBtn = document.getElementById('nextBtn');
        const backBtn = document.getElementById('backBtn');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const subTitle = document.getElementById('subTitle');

        // Validation & Smooth Transition to Step 2
        nextBtn.addEventListener('click', function() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const whatsappNo = document.getElementById('whatsappNo').value.trim();
            const education = document.getElementById('education').value.trim();
            const city = document.getElementById('city').value.trim();

            if(!fullName || !email || !whatsappNo || !education || !city) {
                alert('Please fill in all the personal details first!');
                return;
            }

            // Animate transition
            step1.classList.add('opacity-0', '-translate-x-10');
            setTimeout(() => {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                setTimeout(() => {
                    step2.classList.remove('opacity-0', 'translate-x-10');
                }, 50);
                subTitle.textContent = "Step 2: Select your preferred course";
            }, 300);
        });

        // Back to Step 1
        backBtn.addEventListener('click', function() {
            step2.classList.add('opacity-0', 'translate-x-10');
            setTimeout(() => {
                step2.classList.add('hidden');
                step1.classList.remove('hidden');
                setTimeout(() => {
                    step1.classList.remove('opacity-0', '-translate-x-10');
                }, 50);
                subTitle.textContent = "Step 1: Enter your personal details";
            }, 300);
        });

        // Form Submit & WhatsApp Redirection
        document.getElementById('whatsappForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const adminPhone = "923403535397"; 
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const whatsappNo = document.getElementById('whatsappNo').value;
            const education = document.getElementById('education').value;
            const city = document.getElementById('city').value;
            const courseSelect = document.getElementById('courseSelect').value;

            if(!courseSelect) {
                alert('Please select a course!');
                return;
            }
            
            let text = `I required to Join Course%0A%0A`;
            text += `*Selected Course:* ${courseSelect}%0A`;
            text += `*Full Name:* ${fullName}%0A`;
            text += `*Email:* ${email}%0A`;
            text += `*WhatsApp No:* ${whatsappNo}%0A`;
            text += `*Education:* ${education}%0A`;
            text += `*City:* ${city}`;
            
            const whatsappUrl = `https://wa.me/${adminPhone}?text=${text}`;
            window.open(whatsappUrl, '_blank');
        });
    </script>
</body>
</html>
